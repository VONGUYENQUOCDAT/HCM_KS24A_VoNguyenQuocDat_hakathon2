<body>
    <header>Quản Lý Danh Mục Sách</header>
    <div class="container">
        <div class="box">
            <div class="form-group">
                <label for="namebook">Tên sách: </label>
                <input type="text" id="namebook" name="namebook">
            </div>
            <div class="form-group">
                <label for="author">Tác giả: </label>
                <input type="text" id="author" name="author">
            </div>
            <div class="form-group">
                <label for="year">Năm xuất bản: </label>
                <input type="text" id="year" name="year">
            </div>
            <div class="form-group">
                <label for="category">Thể loại: </label>
                <input type="text" id="category" name="category">
            </div>
            <button class="btn btn-primary" onclick="addBook(event)">Thêm sách</button>
        </div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Tìm kiếm theo tên sách...">        
        </div>
        <table class="table">
            <thead>
              <tr>
                <th scope="col">Tên sách</th>
                <th scope="col">Tác giả</th>
                <th scope="col">Năm</th>
                <th scope="col">Thể loại</th>
                <th scope="col">Hành động</th>
              </tr>
            </thead>
